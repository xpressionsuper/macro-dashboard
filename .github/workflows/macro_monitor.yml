name: 매크로 유동성 모니터 v3

on:
  schedule:
    # 월~토 오전 7시 KST (UTC 일~금 22:00). 미국 지표는 매일 갱신, 한국 수급·부동산은 월요일 아침에만 새로 받음
    # (다른 날은 아래 캐시에 저장된 월요일 수집분 재사용). 일요일 아침은 새 데이터가 없어 건너뜀
    - cron: '0 22 * * 0-5'
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 한국 데이터 주간 저장분 — 매 실행마다 최신 것을 불러오고, 끝나면 새로 저장
      - name: 한국 데이터 저장분 불러오기
        uses: actions/cache@v4
        with:
          path: kr_cache.pkl
          key: kr-cache-${{ github.run_id }}
          restore-keys: kr-cache-

      - name: 모니터 실행
        env:
          TZ: Asia/Seoul
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          MOLIT_API_KEY:    ${{ secrets.MOLIT_API_KEY }}
          ECOS_API_KEY:     ${{ secrets.ECOS_API_KEY }}
        run: python main_combined.py

      - name: Pages용 파일 준비
        run: mkdir site && cp combined_dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
