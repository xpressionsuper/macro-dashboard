name: 매크로 유동성 모니터 v3

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 화~토 오전 7시 KST (UTC 월~금 22:00) — 전날(월~금) 장 마감 데이터 반영, 주말 데이터 없는 일·월 아침은 건너뜀
  workflow_dispatch:         # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 모니터 실행
        env:
          TZ: Asia/Seoul
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
          KIS_APP_KEY:      ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:   ${{ secrets.KIS_APP_SECRET }}
          MOLIT_API_KEY:    ${{ secrets.MOLIT_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main_combined.py

      - name: Pages용 파일 준비
        run: mkdir site && cp combined_dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
